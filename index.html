<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Experimental ISL communication assistant: sign-to-text with spoken output, and live English/Hindi speech-to-text captions." />
    <title>SignLens</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so the page doesn't flash the wrong colours.
      // The deployed site keeps settings in localStorage (in dev they live in isl-data.json and apply after load).
      try {
        var s = (JSON.parse(localStorage.getItem('isl.localData.v1') || '{}').settings) || {};
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.highContrast) document.documentElement.dataset.contrast = 'high';
      } catch (e) {}
    </script>
